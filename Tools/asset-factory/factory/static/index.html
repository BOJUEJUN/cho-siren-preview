<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源工厂</title>
<style>
:root{--bg:#120a24;--panel:#1d1233;--edge:#3a2a60;--ink:#f3eee4;--muted:#a99cc9;--teal:#19f0e8;--pink:#ff2d7a;--gold:#ffd23f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang SC","Noto Sans SC",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--edge)}
h1{margin:0;font-size:20px}.pill{padding:3px 10px;border:1px solid var(--edge);border-radius:999px;color:var(--muted)}
.pill b{color:var(--ink)}button{font:inherit;color:var(--bg);background:var(--teal);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}button.warn{background:var(--pink);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}@media(max-width:900px){main{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover;background:#000;display:block}.card .b{padding:8px 10px}
.st{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--edge)}.st.passed{background:var(--gold);color:var(--bg)}
.st.approved{background:var(--teal);color:var(--bg)}.st.running{background:var(--pink)}.st.gave_up,.st.rejected{background:#5a2a3a}
aside{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:12px;max-height:80vh;overflow:auto}
aside p{margin:4px 0;color:var(--muted);font-size:12px}.bar{height:8px;background:var(--edge);border-radius:4px;overflow:hidden;width:140px}
.bar i{display:block;height:100%;background:var(--teal)}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:12px;width:min(1100px,96vw)}
dialog video,dialog img{max-width:100%;border-radius:8px}.att{border-top:1px solid var(--edge);padding:10px 0}.bad{color:#ff8fae}.good{color:var(--teal)}
textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--edge)}.tabs button.on{background:var(--teal);color:var(--bg)}
</style>
</head>
<body>
<header>
  <h1>CHO-SIREN 资源工厂</h1>
  <span class="pill">显卡 <b id="gpu">-</b></span>
  <span class="pill">利用率 <span class="bar" style="display:inline-block;vertical-align:middle"><i id="util" style="width:0"></i></span> <b id="utilText">0%</b></span>
  <span class="pill">AI 审核 <b id="rev">-</b></span>
  <span class="pill" id="counts"></span>
  <button id="pause">暂停</button>
  <button class="ghost" id="reload">重新读取任务</button>
</header>
<main>
  <section>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="jobs"></div>
  </section>
  <aside><b>动态</b><div id="events"></div></aside>
</main>
<dialog id="dlg"><div id="dlgBody"></div><p><button class="ghost" onclick="dlg.close()">关闭</button></p></dialog>
<script>
const $ = (id) => document.getElementById(id);
const label = {queued:"排队", running:"生成中", review:"待人工看", passed:"AI 通过·待你确认", approved:"已采用", rejected:"已退回", gave_up:"多次未过", paused:"暂停"};
let filter = "all", state = null;
const file = (p) => "/file?path=" + encodeURIComponent(p);
async function load() {
  state = await (await fetch("/api/state")).json();
  $("gpu").textContent = state.mock ? "模拟模式" : (state.gpu.name || state.gpu.error || "-");
  $("util").style.width = Math.round(state.utilisation * 100) + "%"; $("utilText").textContent = Math.round(state.utilisation * 100) + "%";
  $("rev").textContent = state.reviewer || "未配置（只做数值检查）";
  $("pause").textContent = state.paused ? "继续" : "暂停";
  $("counts").innerHTML = Object.entries(state.counts).map(([k, v]) => `${label[k] || k} <b>${v}</b>`).join(" · ");
  const briefs = Object.entries(state.briefs);
  $("tabs").innerHTML = [["all", "全部"], ["passed", "待我确认"], ...briefs.map(([k, v]) => [k, v.title])]
    .map(([k, t]) => `<button class="${filter === k ? "on" : ""}" onclick="filter='${k}';render()">${t}</button>`).join("");
  $("events").innerHTML = state.events.map(e => `<p>${new Date(e.at * 1000).toLocaleTimeString()} · ${e.text}</p>`).join("");
  render();
}
function render() {
  if (!state) return;
  const list = state.jobs.filter(j => filter === "all" || j.brief === filter || (filter === "passed" && j.status === "passed"));
  $("jobs").innerHTML = list.map(j => `<div class="card" onclick="openJob(${j.id})">
    <img loading="lazy" data-job="${j.id}" alt="">
    <div class="b"><b>${(state.briefs[j.brief] || {}).title || j.brief}</b> · ${j.target}<br>
    <span class="st ${j.status}">${label[j.status] || j.status}</span> 第 ${j.attempts}/${j.max_attempts} 次 ${j.note ? "· " + j.note : ""}</div></div>`).join("");
  document.querySelectorAll("img[data-job]").forEach(async (img) => {
    const d = await (await fetch("/api/job/" + img.dataset.job)).json();
    const best = d.attempts.find(a => a.id === d.job.best_attempt) || d.attempts[d.attempts.length - 1];
    if (best && best.outputs[1]) img.src = file(best.outputs[1]);
  });
}
async function openJob(id) {
  const d = await (await fetch("/api/job/" + id)).json();
  const j = d.job;
  const media = (p) => /\.(mp4|webm|mov)$/i.test(p) ? `<video src="${file(p)}" controls loop autoplay muted playsinline style="max-height:60vh"></video>` : `<img src="${file(p)}">`;
  $("dlgBody").innerHTML = `<h2>${(state.briefs[j.brief] || {}).title || j.brief} · ${j.target} <span class="st ${j.status}">${label[j.status] || j.status}</span></h2>
    ${["passed", "review", "gave_up"].includes(j.status) ? `<p><button onclick="act(${id},'approve')">采用（导出到 export）</button>
      <button class="warn" onclick="act(${id},'reject')">退回重做</button> <textarea id="note" rows="2" placeholder="退回原因 / 想要怎么改（会加进提示词）"></textarea></p>` : ""}
    ${j.status === "gave_up" || j.status === "rejected" ? `<p><button class="ghost" onclick="act(${id},'retry')">重新排队</button></p>` : ""}
    ${d.attempts.slice().reverse().map(a => `<div class="att"><b>第 ${a.n} 次</b> · ${a.score != null ? a.score.toFixed(0) + " 分" : ""} ·
      <span class="${a.passed ? "good" : "bad"}">${a.passed ? "通过" : "未过"}</span> · 用时 ${Math.round(a.seconds || 0)} 秒
      ${a.outputs[0] ? "<div>" + media(a.outputs[0]) + "</div>" : ""}
      ${(a.checks.problems || []).concat(a.review.problems || []).map(p => `<div class="bad">· ${p}</div>`).join("")}
      <details><summary>提示词</summary><p>${a.prompt}</p></details></div>`).join("")}`;
  $("dlg").showModal();
}
async function act(id, what) {
  const note = $("note") ? $("note").value : "";
  await fetch(`/api/job/${id}/${what}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({note})});
  $("dlg").close(); load();
}
$("pause").onclick = async () => { await fetch("/api/pause", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}); load(); };
$("reload").onclick = async () => { await fetch("/api/reload", {method: "POST"}); load(); };
load(); setInterval(load, 5000);
</script>
</body>
</html>
