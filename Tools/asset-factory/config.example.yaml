# Copy to config.yaml on the 5090 machine and edit. Never put API keys here: use environment variables.
game_repo: ../..                 # the CHO-SIREN checkout (reference art is read from here)
output_dir: ./output             # every attempt, contact sheet and the job database
export_dir: ./export             # approved assets, ready to import into the game
host: 0.0.0.0                    # 0.0.0.0 to open the page from other machines on the LAN
port: 8790
workers: 2                       # parallel jobs; one reviews while the other generates
mock: false                      # true = no GPU, fake clips (for testing the loop)
comfy_url: http://127.0.0.1:8188
timeout_seconds: 1800
start_paused: false
reviewer:                        # any OpenAI-compatible chat endpoint that accepts images
  base_url: http://127.0.0.1:11434/v1   # e.g. Ollama / vLLM / LM Studio serving a vision model
  model: qwen2.5vl:7b
  pass_score: 75
  timeout: 300
  # api_key_env: REVIEWER_API_KEY       # only for a cloud reviewer; the key stays in the environment
integrate_commit: false          # true = every accepted asset is committed to the game checkout (never pushed)
scout_hours: 24                  # model radar: check Hugging Face trending once a day
asr:                             # voice lines are checked by transcription (OpenAI-compatible, e.g. local faster-whisper server)
  base_url: http://127.0.0.1:8000/v1
  model: large-v3
  language: ja
  cer_max: 0.25

# Model backends. A brief lists which of these may make it; the engine tries each, then mostly uses whichever passes
# most often. Adding a new model = one entry here (+ its ComfyUI workflow) and its name in a brief's `backends`.
backends:
  h3-i2v:      {type: comfy, workflow: i2v-h3}            # MiniMax H3 (FastH3 NVFP4 on the 5090)
  h3-loop:     {type: comfy, workflow: firstlast-h3}      # first = last frame → seamless loops
  h3-t2v:      {type: comfy, workflow: t2v-h3}
  wan22-i2v:   {type: comfy, workflow: i2v-wan22}
  wan22-loop:  {type: comfy, workflow: firstlast-wan22}
  ltx-i2v:     {type: comfy, workflow: i2v-ltx}           # fast drafts
  ltx-t2v:     {type: comfy, workflow: t2v-ltx}
  qwen-image:  {type: comfy, workflow: t2i-qwen}
  flux-image:  {type: comfy, workflow: t2i-flux}
  sovits-ja:   {type: http, url: "http://127.0.0.1:9880/tts", request: {text: "{{prompt}}", text_lang: ja, ref_audio_path: "voices/{{speaker}}.wav", prompt_lang: ja}}
  cosyvoice-ja: {type: http, url: "http://127.0.0.1:50000/tts", request: {text: "{{prompt}}", speaker: "{{speaker}}"}}
  # any CLI tool works too:
  # stable-audio: {type: command, ext: .wav, cmd: [python, tools/stable_audio.py, --prompt, "{{prompt}}", --out, "{{out}}"]}

# Quality first: a model gets `trial_attempts` tries per brief, then only works there if it is the best (or within 10
# points). A model whose pass rate stays under `min_pass_rate` while another does better is switched off; a brief that
# even the best model rarely passes is paused until a better model is added.
trial_attempts: 3
min_pass_rate: 0.25
min_brief_pass: 0.2
audio_reviewer:                  # an audio-capable judge (e.g. Qwen2.5-Omni behind vLLM); voices also need `asr`
  base_url: ""
  model: qwen2.5-omni-7b
  pass_score: 75

