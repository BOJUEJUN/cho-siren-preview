# What the factory makes for CHO-SIREN. Each brief is one kind of asset; each target is one asset of that kind.
# Paths in `reference` are relative to `game_repo` in config.yaml (or absolute). {id} etc. come from the target.
# `checks` are the hard numeric checks (review.py numeric_checks); `rubric` is what the AI reviewer judges.
# `variants`: keep making until this many passed versions exist per target (the GPU never idles while any are short).

briefs:
  - id: lobby-idle
    title: 大厅待机动画
    kind: video
    backends: [h3-loop, wan22-loop]   # first frame = last frame = her art → a seamless loop
    integrate: {type: inbox, how: "Mac 上 matte.swift 抠成左彩右透明 → LobbyIdols，并在大厅轮播加这位"}
    priority: 70
    variants: 2
    max_attempts: 6
    size: [720, 1280]
    frames: 145                    # ~6 s at 24 fps
    fps: 24
    reference: Assets/Resources/Art/Members/member-{id}.png
    last_frame: same
    prompt: >-
      anime idol girl {look}, standing on a plain pure white background, full body, subtle idle animation:
      gentle breathing, slow blink, hair and clothes swaying slightly, small hand gesture, she stays in place,
      camera locked, no zoom, same outfit and face as the reference, clean lineart, game character idle loop
    negative: background scenery, camera move, zoom, extra people, extra limbs, deformed hands, face change, outfit change, text, watermark
    checks: {seconds: [5, 8], loop: true, loop_seam_max: 6, motion: [0.3, 6], flicker_max: 3, clean_background: true, min_height: 1200}
    rubric: |
      1. 人物和参考原画是同一个角色：脸、发型、发色、服装、配饰一致，没有换脸、换衣服。
      2. 只是轻微待机：呼吸、眨眼、头发衣服轻摆、小手势；人物不走动、不出画、不转身。
      3. 背景始终是干净的纯白，没有场景、阴影块、地面。
      4. 手指、眼睛、嘴巴没有崩坏、融化、多余肢体。
      5. 首帧和尾帧姿势一致，能无缝循环。
    targets:
      - {id: huansha, look: "with a holographic spiked beanie, long silver hair, black leather jacket, white and black baggy pants"}
      - {id: yaoguang, look: "dancer"}
      - {id: hupo, look: "support idol"}

  - id: ult-cutin
    title: 大招动画
    kind: video
    backends: [h3-i2v, wan22-i2v]
    integrate: {type: ultimate}      # 验收后直接进游戏：和她已有的大招随机播
    priority: 60
    variants: 2
    max_attempts: 6
    size: [720, 1472]
    frames: 121                    # ~5 s
    fps: 24
    reference: Assets/Resources/Art/Members/member-{id}.png
    prompt: >-
      anime idol {look} performing her ultimate on a neon concert stage, dynamic camera: fast push-in to her face,
      she sings into the microphone, spotlights and {color} energy burst, confetti, ends on a strong pose,
      same character and outfit as the reference, high quality anime game cutscene
    negative: different character, outfit change, extra people, deformed hands, melted face, text, watermark, blurry
    checks: {seconds: [3.5, 6], motion: [1.5, 22], flicker_max: 8, min_height: 1200}
    rubric: |
      1. 主角是参考原画里的同一个角色，脸、发型、服装一致。
      2. 有明显的大招演出感：镜头推进或环绕、灯光、特效爆发，结尾定格在帅气姿势。
      3. 没有崩脸、崩手、肢体错位，没有多出来的人。
      4. 画面清晰，不糊，不是幻灯片式的跳帧。
    targets:
      - {id: yaoguang, look: "dancer", color: violet}
      - {id: hupo, look: "support idol", color: amber}
      - {id: xianyue, look: "lead vocalist", color: blue}

  - id: transition
    title: 种族转场
    kind: video
    backends: [h3-i2v, ltx-i2v]
    integrate: {type: inbox, how: "放进 StreamingAssets/Transitions，并在进关卡转场按种族挑选"}
    priority: 55
    variants: 3
    max_attempts: 5
    size: [720, 1280]
    frames: 49                     # ~2 s
    fps: 24
    reference: Tools/asset-factory/inputs/transitions/{race}.png
    prompt: >-
      stylish game transition animation: the bright {tone} character silhouette sweeps in from the side with motion trails,
      hair and tail flowing, the CHO-SIREN logo flashes, graphic shapes slide, then the frame wipes away,
      flat two-tone poster style exactly like the reference image, fast and punchy
    negative: realistic, 3d render, extra characters, text changes, blurry, slow
    checks: {seconds: [1.5, 3], motion: [2, 30], flicker_max: 12, min_height: 1200}
    rubric: |
      1. 画风和参考转场图一致：平涂双色剪影海报风，颜色一致。
      2. 剪影角色有明显的入场动势（划入、拖影），而不是静止。
      3. 节奏快、干净，适合 1-2 秒的转场；没有乱码文字和杂乱碎块。
    targets:
      - {race: 人鱼, tone: cyan}
      - {race: 恶魔, tone: crimson}
      - {race: 精灵, tone: violet}
      - {race: 魅族, tone: pink}

  - id: boss-entrance
    title: 首领入场
    kind: video
    backends: [h3-i2v, wan22-i2v]
    integrate: {type: inbox, how: "放进 StreamingAssets/BossEntrance1102，在 StageBoss1103 打开 EntranceVideo"}
    priority: 50
    variants: 2
    max_attempts: 6
    size: [720, 1280]
    frames: 73                     # ~3 s
    fps: 24
    reference: "{art}"
    prompt: >-
      dark fantasy anime boss "{name}" makes a dramatic entrance on a ruined neon stage: she rises from {element},
      eyes glow, cape and hair whip in the wind, shockwave, camera tilts up to her, ends in a menacing pose,
      same design as the reference, game boss intro cutscene
    negative: different character, cute, extra people, deformed hands, text, watermark
    checks: {seconds: [2.5, 4.5], motion: [1.5, 24], flicker_max: 10, min_height: 1200}
    rubric: |
      1. 首领造型和参考图一致（发型、服装、配色、标志物）。
      2. 有压迫感的入场：从暗处/特效中出现、镜头仰拍或推进、结尾停在有威胁的姿势。
      3. 没有崩脸崩手、多余人物；画面清晰。
    targets:
      - {id: luna, name: 碎音·琉娜, art: Assets/Resources/Art/BattleUser/boss-throne-20260928.png, element: "shattered sound waves"}
      - {id: melody, name: 幻蚀歌枢·梅洛蒂, art: Assets/Resources/Art/BattleUser/boss-throne-user-v1.png, element: "corrupted music notes"}
      - {id: selene, name: 深潮女王·赛琳, art: Assets/Resources/Art/BattleUser/boss-selene-1103.png, element: "a deep sea whirlpool"}

  - id: minion-enter
    title: 小怪入场 / 倒下
    kind: video
    backends: [h3-i2v, ltx-i2v]
    integrate: {type: inbox, how: "抠图后替换 BattleEnter1112 的淡入，或做成小怪登场视频"}
    priority: 40
    variants: 1
    max_attempts: 5
    size: [720, 1280]
    frames: 37                     # ~1.5 s
    fps: 24
    reference: Assets/Resources/Art/Enemies/{id}-ai-v1.png
    prompt: >-
      anime game enemy {id} jumps into frame and lands in a battle stance on a plain pure white background,
      quick and readable motion, camera locked, same design as the reference
    negative: background scenery, extra characters, deformed, text
    checks: {seconds: [1, 2.5], motion: [1, 20], clean_background: true, min_height: 1200}
    rubric: |
      1. 敌人造型和参考图一致。
      2. 1-2 秒内完成一次清楚的入场（跳入/冲入后落地站好）。
      3. 背景纯白，方便抠图；没有崩坏。
    targets:
      - {id: neon-scout}
      - {id: noise-wraith}
      - {id: pulse-guard}
      - {id: echo-drone}

  # ---------------------------------------------------------------- beyond video (少爷: 不只动画，图像、音频…要看质量)

  - id: stage-bg
    title: 关卡背景
    kind: image
    backends: [qwen-image, flux-image]
    priority: 35
    variants: 1
    max_attempts: 5
    size: [1080, 1920]
    integrate: {type: file, path: "Assets/StreamingAssets/LevelScenes1102/{id}.jpg"}   # 游戏按关卡 id 自动读取
    prompt: >-
      vertical anime game stage background for stage {stage} of CHO-SIREN, a neon idol city at night, empty stage area in
      the lower half for characters, cinematic lighting, rich detail, no people, no text, consistent with the game's
      purple-teal punk palette
    negative: people, characters, text, watermark, logo, blurry, lowres
    checks: {min_height: 1800, aspect: [9, 16]}
    rubric: |
      1. 竖版关卡背景，下半部分留出站人的空地，没有人物、文字、水印。
      2. 霓虹都市夜景、紫青朋克配色，和游戏现有关卡背景同一画风。
      3. 细节丰富不糊，没有扭曲的建筑或乱码招牌。
    targets: []                       # 资源工厂会自己找出没有专属背景的关卡（页面「AI 建议」）

  - id: home-voice
    title: 大厅台词配音（日语）
    kind: voice
    backends: [sovits-ja, cosyvoice-ja]
    priority: 30
    variants: 1
    max_attempts: 6
    prompt: "{text}"
    expect_text: "{text}"             # 听写回来要和这句对得上
    integrate: {type: inbox, how: "放进 Resources/Audio/Voice/Home，并在 DialogueVoice1102.HomeClip 给这位接上"}
    checks: {seconds: [1, 8], loudness_db: [-28, -14], silence_max: .45}
    rubric: 日语发音清楚、和这个角色的声线一致、情绪对、不爆音。
    targets:
      - {id: huanhuoling-1, speaker: huanhuoling, text: "にゃ〜、私の瞳に夢中になっちゃった？"}
      - {id: huanhuoling-2, speaker: huanhuoling, text: "もっと近くに来て。あなたを一番のファンにしてあげる。"}
      - {id: linyin-1, speaker: linyin, text: "私のビートについてきて。遅れたら置いていくよ。"}
      - {id: linyin-2, speaker: linyin, text: "どんな盾だって、私が叩き割ってあげる！"}

  - id: vfx-burst
    title: 技能特效（序列帧）
    kind: video
    backends: [h3-t2v, ltx-t2v]
    priority: 25
    variants: 1
    max_attempts: 5
    size: [768, 768]
    frames: 25                       # ~1 s → cut into a flipbook atlas
    fps: 24
    prompt: >-
      2D game skill effect on a pure black background, {fx}, bright additive glow, centered, burst then fade out to
      black, no characters, stylized anime VFX, seamless edges
    negative: characters, background scenery, text, watermark, camera move
    checks: {seconds: [0.8, 1.5], motion: [3, 40], clean_background: true, background_bgr: [0, 0, 0]}
    integrate: {type: inbox, how: "切成序列帧图集，替换 Fx1023 对应种族的命中/大招特效"}
    rubric: |
      1. 纯黑底，只有特效，没有人物和场景，方便叠加发光。
      2. 1 秒左右：起爆 → 扩散 → 消散到全黑，节奏干脆。
      3. 颜色和形状符合描述，边缘不被画面裁掉。
    targets:
      - {id: charm-heart, fx: "pink heart-shaped flame burst with sparkles"}
      - {id: demon-claw, fx: "crimson triple claw slash with ember sparks"}
      - {id: mermaid-wave, fx: "cyan water splash ring with bubbles"}
      - {id: bloodelf-moon, fx: "violet crescent moon slash with petals"}

