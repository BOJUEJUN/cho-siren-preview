<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08061f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="幻域魅声">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CHO-SIREN 幻域魅声</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="preload" href="./media/loading-stage.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="stylesheet" href="./home-stage.css?v=20260929-r17">
    <link rel="stylesheet" href="./character-moments.css?v=20260928-r12a">
    <style>
      :root {
        color-scheme: dark;
        --portrait-ratio: 720 / 1536;
        --page-bg: #08061f;
        --accent: #ff69bf;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 10%, rgba(113, 74, 184, 0.34), transparent 36%),
          linear-gradient(180deg, #17113d 0%, var(--page-bg) 72%);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        position: relative;
        z-index: 0;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* Wide screens: the stage art, blurred and dimmed, fills the space beside the
         portrait shell instead of flat colour. Portrait phones never draw it. */
      @media (min-aspect-ratio: 4/5) {
        body::before {
          content: "";
          position: fixed;
          inset: -64px;
          z-index: -1;
          background: url("./media/loading-stage.webp") center / cover no-repeat;
          filter: blur(34px) brightness(0.4) saturate(1.2);
        }
      }

      #game-shell {
        position: relative;
        width: min(100%, calc(100vh * 720 / 1536));
        height: min(100%, calc(100vw * 1536 / 720));
        max-width: 720px;
        max-height: 1536px;
        aspect-ratio: var(--portrait-ratio);
        overflow: hidden;
        background: #090625;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.48);
      }

      @supports (height: 100dvh) {
        #game-shell {
          width: min(100%, calc(100dvh * 720 / 1536));
          height: min(100%, calc(100dvw * 1536 / 720));
        }
      }

      /* Phones: no long-press menu, text selection or page zoom on the game;
         Unity handles every touch itself. */
      #game-shell {
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        background: #090625;
        cursor: url("./lipstick-cursor.svg") 19 3, auto;
      }

      .lipstick-trail {
        position: absolute;
        z-index: 5;
        width: 7px;
        height: 7px;
        background: #ff83bd;
        transform: rotate(-45deg);
        filter: drop-shadow(0 0 5px #ff65b5);
        pointer-events: none;
        animation: lipstick-trail-fade .62s ease-out forwards;
      }
      .lipstick-trail::before, .lipstick-trail::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: inherit;
      }
      .lipstick-trail::before { top: -3.5px; left: 0; }
      .lipstick-trail::after { top: 0; left: 3.5px; }

      @keyframes lipstick-trail-fade {
        to { opacity: 0; transform: translate(-8px, -22px) rotate(-45deg) scale(.28); }
      }

      @media (hover: none), (pointer: coarse) {
        #unity-canvas { cursor: auto; }
        .lipstick-trail { display: none; }
      }

      /* The only loading screen players see: it covers the Unity splash and Unity's
         own asset-loading scene, and lifts once the lobby is live. Sizes follow the
         720-wide shell (cqw), with fixed fallbacks for browsers without them. */
      #game-shell { container-type: inline-size; }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 4;
        text-align: center;
        background:
          radial-gradient(ellipse 56% 30% at 50% 36%, rgba(146, 64, 206, 0.62), rgba(146, 64, 206, 0) 72%),
          radial-gradient(ellipse 64% 10% at 50% 65.5%, rgba(12, 5, 38, 0.62), rgba(12, 5, 38, 0) 100%),
          linear-gradient(180deg, rgba(8, 6, 31, 0) 55%, rgba(8, 6, 31, 0.55) 100%),
          url("./media/loading-stage.webp") center / cover no-repeat,
          #0b0828;
        transition: opacity 420ms ease;
      }

      #loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-title {
        position: absolute;
        top: 28%;
        left: 0;
        right: 0;
        display: grid;
        gap: 10px;
        justify-items: center;
      }

      .brand {
        color: #ff9fd6;
        font-size: 12px;
        font-size: 2.3cqw;
        font-weight: 700;
        letter-spacing: 0.32em;
      }

      .loading-name {
        color: #fff;
        font-size: 38px;
        font-size: 9.4cqw;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-shadow: 0 0 18px rgba(214, 120, 255, 0.85), 0 2px 6px rgba(20, 0, 40, 0.6);
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.78);
        font-size: 13px;
        font-size: 2.9cqw;
        letter-spacing: 0.24em;
      }

      .loading-progress {
        position: absolute;
        top: 61%;
        left: 0;
        right: 0;
        display: grid;
        gap: 12px;
        justify-items: center;
      }

      .track {
        width: 66%;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(20, 10, 48, 0.62);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      #progress {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff7cc8, var(--accent));
        box-shadow: 0 0 14px rgba(255, 105, 191, 0.8);
        transition: width 260ms ease-out;
      }

      .loading-status {
        color: #fff;
        font-size: 13px;
        font-size: 2.9cqw;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-shadow: 0 1px 4px rgba(20, 0, 40, 0.7);
      }

      .loading-note {
        max-width: 78%;
        min-height: 2.9em;
        color: rgba(255, 255, 255, 0.8);
        font-size: 11px;
        font-size: 2.3cqw;
        line-height: 1.45;
        letter-spacing: 0.04em;
        white-space: pre-line;
        text-shadow: 0 1px 3px rgba(20, 0, 40, 0.7);
      }

      /* Live release number (release.json); scripts/verify-webgl.mjs keeps them equal. */
      .loading-version {
        position: absolute;
        right: 12px;
        bottom: 10px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 10px;
        letter-spacing: 0.06em;
      }

      #warning {
        position: absolute;
        z-index: 5;
        top: 12px;
        left: 12px;
        right: 12px;
        display: none;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        color: #fff;
        background: rgba(38, 19, 66, 0.94);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        /* The game area blocks touch gestures and selection; messages stay scrollable and copyable. */
        touch-action: pan-y;
        -webkit-user-select: text;
        user-select: text;
      }

      #retry {
        display: none;
        width: 100%;
        margin-top: 9px;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 9px;
        color: #fff;
        background: linear-gradient(90deg, #704ee8, #c34caa);
        font: inherit;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        #game-shell {
          max-width: none;
          max-height: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" width="720" height="1536" tabindex="-1"></canvas>
      <div id="home-stage" aria-hidden="true">
        <div class="stage-beam stage-beam-a"></div>
        <div class="stage-beam stage-beam-b"></div>
        <canvas id="stage-atmosphere"></canvas>
        <div id="stage-beat-meter"></div>
        <canvas id="stage-sparks"></canvas>
      </div>
      <section id="character-moment" aria-label="首页角色演出" aria-hidden="true">
        <video id="moment-video" playsinline webkit-playsinline preload="none"></video>
      </section>
      <div id="warning" role="status">
        <span id="warning-text"></span>
        <button id="retry" type="button">重新加载</button>
      </div>
      <div id="loading">
        <div class="loading-title">
          <div class="brand">CHO-SIREN</div>
          <div class="loading-name">幻域魅声</div>
          <div class="subtitle">通往舞台的星途</div>
        </div>
        <div class="loading-progress">
          <div class="track"><div id="progress"></div></div>
          <div id="loading-status" class="loading-status">正在载入舞台资源 · 0%</div>
          <div id="loading-note" class="loading-note"></div>
        </div>
        <div id="loading-version" class="loading-version">v0.3.14</div>
      </div>
    </main>

    <script src="./audio-skin.js?v=20261005-r17f"></script>
    <script src="./home-stage.js?v=20260928-r12a"></script>
    <script src="./character-moments.js?v=20261006-r17h"></script>
    <script>
      const pageUrl = new URL("./", document.baseURI);
      const retryToken = new URL(window.location.href).searchParams.get("retry");
      const assetCacheName = "cho-siren-assets-1";
      const workers = "serviceWorker" in navigator ? navigator.serviceWorker : null;
      // service-worker.js keeps the content-addressed game files (the Unity build and
      // hashed StreamingAssets art) so returning players start from local storage; it
      // never caches this page or any manifest. A ?retry= load starts clean instead:
      // it drops this game's worker and cache, never another project's.
      let assetWorker = Promise.resolve(null);
      if (retryToken && workers) {
        navigator.serviceWorker.getRegistrations()
          .then(registrations => Promise.all(registrations
            .filter(registration => registration.scope === pageUrl.href)
            .map(registration => registration.unregister())))
          .catch(() => {});
      } else if (workers && workers.register) {
        assetWorker = workers.register(new URL("service-worker.js", pageUrl).href,
          { scope: pageUrl.href, updateViaCache: "none" }).catch(() => null);
      }
      if ("caches" in window) {
        caches.keys()
          .then(keys => Promise.all(keys
            .filter(key => /^cho-siren-v\d+$/.test(key) || (retryToken && key === assetCacheName))
            .map(key => caches.delete(key))))
          .catch(() => {});
      }
      // On a first visit, give the new worker up to 1.5 s to take control so that
      // this very load already fills the cache.
      const assetWorkerControl = !workers || !workers.register || retryToken || workers.controller
        ? Promise.resolve()
        : new Promise(resolve => {
          workers.addEventListener("controllerchange", resolve, { once: true });
          assetWorker.then(registration => { if (!registration) resolve(); });
          window.setTimeout(resolve, 1500);
        });

      const shell = document.querySelector("#game-shell");
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress");
      const loadingNote = document.querySelector("#loading-note");
      const loadingStatus = document.querySelector("#loading-status");
      const warning = document.querySelector("#warning");
      const warningText = document.querySelector("#warning-text");
      const retry = document.querySelector("#retry");
      let fatalLoadError = false;
      let bannerTimer;

      function showBanner(message, type) {
        // A later warning must not hide the actionable loading error.
        if (fatalLoadError && type !== "error") return;
        if (type === "error") fatalLoadError = true;
        window.clearTimeout(bannerTimer);
        const detail = String(message || "");
        const isLoadFailure = type === "error" && (
          detail.includes("fetching of the wasm failed") ||
          detail.includes("Failed to download file") ||
          detail.includes("Failed to fetch") || detail.includes("Unable to parse")
        );
        warningText.textContent = isLoadFailure
          ? "游戏资源加载中断。请确认网络稳定后重新加载；手机端建议关闭其他大型应用再试。"
          : detail;
        retry.style.display = type === "error" ? "block" : "none";
        warning.style.display = "block";
        warning.style.borderColor = type === "error" ? "#ff5f7f" : "rgba(255,255,255,.18)";
        if (type !== "error") {
          bannerTimer = window.setTimeout(() => {
            if (!fatalLoadError) warning.style.display = "none";
          }, 5000);
        }
      }

      // iOS can take the game's WebGL context away while the page sits in the
      // background, and Unity cannot rebuild it: the screen goes black or freezes.
      // A plain reload brings it back quickly from the cached game files, unlike the
      // network-only retry used for failed downloads.
      let contextLost = false;
      canvas.addEventListener("webglcontextlost", () => {
        contextLost = true;
        showBanner("游戏画面被系统收回了（通常是在后台放得太久）。点下面的按钮重新载入即可。", "error");
      });

      retry.addEventListener("click", () => {
        if (contextLost) {
          window.location.reload();
          return;
        }
        const refreshed = new URL(window.location.href);
        refreshed.searchParams.set("retry", Date.now().toString(36));
        window.location.replace(refreshed.href);
      });

      // All URLs stay relative to the document so GitHub Pages project paths work.
      const buildUrl = new URL("Build/", pageUrl);
      const buildAssetUrl = filename => {
        const url = new URL(filename, buildUrl);
        if (retryToken) url.searchParams.set("retry", retryToken);
        return url.href;
      };
      const config = {
        arguments: [],
        cacheControl: () => retryToken ? "no-store" : "must-revalidate",
        dataUrl: buildAssetUrl("e2dd1290b6ccc5d2cc6e1ab45036d32a.data.unityweb"),
        frameworkUrl: buildAssetUrl("3085ec3f1ee1e29db75fb8699374a35c.framework.js.unityweb"),
        codeUrl: buildAssetUrl("7eecc22377942e365eca0b7039949f12.wasm.unityweb"),
        streamingAssetsUrl: new URL("StreamingAssets/", pageUrl).href,
        companyName: "CHO-SIREN Studio",
        productName: "CHO-SIREN 幻域魅声",
        productVersion: "0.3.14",
        showBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        matchWebGLToCanvasSize: true
      };

      const loader = document.createElement("script");
      loader.src = buildAssetUrl("5e8b4fd6e60dcb66ea7540fbd1225889.loader.js");
      // One bar from first byte to the lobby: the engine download and start-up fill it
      // to 70 %, Unity's own asset loading (running hidden underneath, together with
      // the Unity splash) moves it towards 98 %, and the lobby going live completes it.
      let shownProgress = 0;
      function showProgress(value) {
        shownProgress = Math.max(shownProgress, Math.min(1, value));
        const percent = Math.round(shownProgress * 100);
        progress.style.width = `${percent}%`;
        loadingStatus.textContent = `正在载入舞台资源 · ${percent}%`;
      }
      // Every StreamingAssets file Unity finishes nudges the bar, plus a slow creep so it
      // never stalls. The lobby going active ends the wait; a minute is the upper bound
      // in case a future build opens on another screen.
      function untilLobbyReady() {
        loadingNote.textContent = "正在准备舞台与界面素材，完成后自动进入大厅";
        return new Promise(resolve => {
          let files = 0, ticks = 0, observer = null;
          if (typeof PerformanceObserver === "function") {
            try {
              observer = new PerformanceObserver(list => {
                files += list.getEntries().filter(entry => entry.name.includes("/StreamingAssets/")).length;
              });
              observer.observe({ type: "resource", buffered: true });
            } catch (_) { observer = null; }
          }
          const check = () => {
            showProgress(0.7 + 0.28 * (1 - Math.exp(-(files + ticks * 0.05) / 15)));
            if (window.choSirenStage?.active || ++ticks > 400) {
              if (observer) observer.disconnect();
              resolve();
            } else {
              window.setTimeout(check, 150);
            }
          };
          check();
        });
      }
      loader.onload = async () => {
        try {
          window.choSirenUnityInstance = await createUnityInstance(canvas, config, value => {
          showProgress(value * 0.7);
          // Downloads end at 0.9; the rest is decompression and engine start-up.
          if (value >= 0.9) loadingNote.textContent = "资源已就绪，正在解压并启动游戏（不消耗流量）…";
          });
          await untilLobbyReady();
          showProgress(1);
          loading.classList.add("is-hidden");
        } catch (error) { showBanner(String(error), "error"); }
      };
      loader.onerror = () => showBanner("游戏资源加载失败，请通过 HTTPS 网页链接访问并刷新重试。", "error");
      async function startGame() {
        // Choose a COMPLETE current bundle before loading any Unity script.
        // This handles a cached HTML entry without mixing old and new binaries.
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 5000);
        try {
          const versionUrl = new URL("build-versions.json", pageUrl);
          versionUrl.searchParams.set("_", Date.now().toString(36));
          const response = await fetch(versionUrl.href, {
            cache: "no-store", credentials: "same-origin", signal: controller.signal
          });
          if (!response.ok) throw new Error("Version check unavailable");
          const version = await response.json();
          const files = version.current;
          const suffixes = [".data.unityweb", ".framework.js.unityweb", ".wasm.unityweb", ".loader.js"];
          const safe = /^[a-f0-9]{32}\.(?:data\.unityweb|framework\.js\.unityweb|wasm\.unityweb|loader\.js)$/;
          if (version.schemaVersion !== 1 || !Array.isArray(files) || files.length !== 4 ||
              new Set(files).size !== 4 || !files.every(file => typeof file === "string" && safe.test(file)) ||
              !suffixes.every(suffix => files.filter(file => file.endsWith(suffix)).length === 1)) {
            throw new Error("Invalid version metadata");
          }
          const asset = suffix => buildAssetUrl(files.find(file => file.endsWith(suffix)));
          config.dataUrl = asset(".data.unityweb");
          config.frameworkUrl = asset(".framework.js.unityweb");
          config.codeUrl = asset(".wasm.unityweb");
          loader.src = asset(".loader.js");
          // Cached files of any other Unity build can go.
          const previous = Array.isArray(version.previous) ? version.previous.filter(file => safe.test(file)) : [];
          workers?.controller?.postMessage({ type: "keep-builds", files: [...files, ...previous] });
        } catch (_) {
          // Offline, slow, or older host: the embedded complete bundle remains valid.
          // Publication retains the preceding bundle at these immutable URLs.
        } finally { window.clearTimeout(timeout); }
        await showDownloadNote();
        await assetWorkerControl;
        document.body.appendChild(loader);
      }
      async function showDownloadNote() {
        let cached = false;
        try {
          if (!retryToken && "caches" in window) {
            cached = Boolean(await caches.match(config.dataUrl, { cacheName: assetCacheName }));
          }
        } catch (_) {}
        loadingNote.textContent = cached ? "正在从本机缓存载入…"
          : "首次进入需下载约 150MB 资源，建议连接 Wi-Fi" + (workers ? "\n下次打开直接读取本机缓存" : "");
      }
      const trailHost = document.querySelector("#game-shell");
      let lastLipstickPoint = null;
      canvas.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse" || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const box = trailHost.getBoundingClientRect();
        const point = { x: event.clientX - box.left, y: event.clientY - box.top };
        if (lastLipstickPoint && Math.hypot(point.x - lastLipstickPoint.x, point.y - lastLipstickPoint.y) < 19) return;
        lastLipstickPoint = point;
        const mark = document.createElement("i");
        mark.className = "lipstick-trail";
        mark.style.left = `${point.x - 2}px`;
        mark.style.top = `${point.y + 8}px`;
        mark.addEventListener("animationend", () => mark.remove(), { once: true });
        trailHost.appendChild(mark);
      }, { passive: true });
      canvas.addEventListener("pointerleave", () => { lastLipstickPoint = null; });
      canvas.addEventListener("dblclick", () => {
        if (window.choSirenStage?.active) {
          window.choSirenUnityInstance?.SendMessage("PsdHome20260921", "ToggleUiFromBrowser");
        }
      });
      startGame();
    </script>
  </body>
</html>
