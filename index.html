<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08061f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="幻域魅声">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CHO-SIREN 幻域魅声</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="preload" href="./media/loading-cg.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="stylesheet" href="./home-stage.css?v=20260929-r17">
    <link rel="stylesheet" href="./character-moments.css?v=20260928-r12a">
    <style>
      :root {
        color-scheme: dark;
        --portrait-ratio: 720 / 1536;
        --page-bg: #08061f;
        --accent: #ff69bf;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 10%, rgba(113, 74, 184, 0.34), transparent 36%),
          linear-gradient(180deg, #17113d 0%, var(--page-bg) 72%);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        position: relative;
        z-index: 0;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* Any space the portrait shell leaves (browser bars on phones, the Dynamic Island
         and home-indicator insets in home-screen mode, wide desktop screens) shows the
         stage art blurred and dimmed, the way mobile H5 games pad their letterbox,
         instead of bare purple bars. The shell itself stays inside the safe area. */
      body::before {
        content: "";
        position: fixed;
        inset: -64px;
        z-index: -1;
        background: url("./media/loading-stage.webp") center / cover no-repeat;
        filter: blur(28px) brightness(0.5) saturate(1.2);
      }
      @media (min-aspect-ratio: 4/5) {
        body::before { filter: blur(34px) brightness(0.4) saturate(1.2); }
      }

      #game-shell {
        position: relative;
        width: min(100%, calc(100vh * 720 / 1536));
        height: min(100%, calc(100vw * 1536 / 720));
        max-width: 720px;
        max-height: 1536px;
        aspect-ratio: var(--portrait-ratio);
        overflow: hidden;
        background: #090625;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.48);
      }

      @supports (height: 100dvh) {
        #game-shell {
          width: min(100%, calc(100dvh * 720 / 1536));
          height: min(100%, calc(100dvw * 1536 / 720));
        }
      }

      /* Portrait phones (including WeChat's shorter in-app browser): the game fills the whole
         viewport instead of keeping the 720x1536 box, so no side strips appear. The game
         itself adapts its layout to the real screen shape. Desktop keeps the framed box. */
      @media (max-aspect-ratio: 3/4) {
        #game-shell {
          width: 100%;
          height: 100%;
          max-width: none;
          max-height: none;
          aspect-ratio: auto;
          box-shadow: none;
        }
      }

      /* Phones: no long-press menu, text selection or page zoom on the game;
         Unity handles every touch itself. */
      #game-shell {
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        background: #090625;
        cursor: url("./lipstick-cursor.svg") 19 3, auto;
      }

      /* Mouse trail (2026-10-19): pink / cyan / white shards with an ink rim and a few
         star glints, drawn on one canvas over the game. */
      #siren-trail { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

      @media (hover: none), (pointer: coarse) {
        #unity-canvas { cursor: auto; }
        #siren-trail { display: none; }
      }

      /* The only loading screen players see: it covers the Unity splash and Unity's
         own asset loading, and becomes a tap-to-start title screen once the lobby is
         live. Like the CG loading screens of big mobile games, the full screen is the
         looping CG (loading-cg.js); only the logo, two buttons and a slim loading
         strip sit on top. Sizes are in cqw so it scales with the 720-wide shell. */
      #game-shell { container-type: inline-size; }

      #loading {
        --hot: #ff2e93;
        --cyan: #3ff0ff;
        position: absolute;
        inset: 0;
        z-index: 4;
        overflow: hidden;
        background: #12061f url("./media/loading-cg.webp") center / cover no-repeat;
        text-align: left;
      }

      .ld-cg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      /* Soft shades behind the logo and the loading strip, so text stays readable. */
      .ld-shade-top, .ld-shade-bottom { position: absolute; left: 0; right: 0; pointer-events: none; }
      .ld-shade-top { top: 0; height: 16%; background: linear-gradient(rgba(10, 4, 24, 0.55), rgba(10, 4, 24, 0)); }
      .ld-shade-bottom {
        bottom: 0;
        height: 30%;
        background: linear-gradient(rgba(10, 4, 24, 0), rgba(10, 4, 24, 0.62) 45%, rgba(10, 4, 24, 0.86));
      }

      /* One monochrome circular iris, shared with the game's rounded scene transitions. */
      #loading::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300%;
        aspect-ratio: 1;
        border-radius: 50%;
        z-index: 9;
        visibility: visible;
        background: #893eff;
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none;
      }
      #loading.is-hidden { pointer-events: none; animation: ld-gone 0s 0.45s forwards; }
      #loading.is-hidden::after { animation: ld-wipe 0.9s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
      @keyframes ld-gone { to { visibility: hidden; } }
      @keyframes ld-wipe {
        0% { transform: translate(-50%, -50%) scale(0); }
        45%, 55% { transform: translate(-50%, -50%) scale(1); }
        100% { transform: translate(-50%, -50%) scale(0); }
      }

      /* Small ransom-note logo, top left. */
      /* NIKKE-style title: logo low and centred, entries stacked down the left edge. */
      .ld-title { position: absolute; left: 50%; bottom: 23%; z-index: 3; transform: translateX(-50%); }
      .ld-ransom { display: flex; align-items: flex-end; gap: 0.4cqw; }
      .ld-ransom span {
        display: inline-grid;
        place-items: center;
        padding: 0.06em 0.1em 0.1em;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0.6cqw 0.6cqw 0 #000;
      }
      .ld-r1 { font-size: 7cqw; color: #000; background: #fff; transform: rotate(-8deg); font-family: "Songti SC", "STSong", "SimSun", serif; }
      .ld-r2 { font-size: 5.6cqw; color: #fff; background: #000; border: 0.35cqw solid #fff; transform: rotate(5deg) translateY(-0.6cqw); }
      .ld-r3 { font-size: 6.4cqw; color: #fff; background: var(--hot); transform: rotate(-4deg); }
      .ld-r4 { font-size: 6cqw; color: #b8125f; background: #fff; transform: rotate(7deg) translateY(-1cqw); font-family: "Songti SC", "STSong", "SimSun", serif; }
      .ld-tag {
        display: inline-block;
        margin: 2cqw 0 0 0.6cqw;
        padding: 0.4cqw 1.6cqw;
        border-left: 1cqw solid var(--cyan);
        color: #fff;
        background: #000;
        font-size: 2.2cqw;
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0.3em;
        transform: skewX(-14deg) rotate(-3deg);
      }

      /* 适龄提示 (CADPA-style): coloured age block over a white CADPA strip, tap for details. */
      .age-badge {
        position: static;
        display: grid; justify-items: center; gap: 0.6cqw;
        padding: 0; border: 0; background: none; color: #fff; font: inherit; cursor: pointer;
      }
      .age-badge .age-card {
        display: grid; width: 10cqw; overflow: hidden; border-radius: 1.3cqw;
        border: 0.45cqw solid #fff; box-shadow: 0 0.6cqw 1.6cqw rgba(0, 0, 0, 0.45);
      }
      .age-badge .age-num {
        display: grid; place-items: center; height: 7.6cqw; background: #f5a300;
        color: #fff; font-size: 4.9cqw; font-weight: 900; letter-spacing: -0.04em;
        text-shadow: 0 0.3cqw 0 rgba(120, 60, 0, 0.45);
      }
      .age-badge .age-org {
        display: grid; place-items: center; height: 2.7cqw; background: #fff;
        color: #222; font-size: 1.75cqw; font-weight: 900; letter-spacing: 0.08em;
      }
      .age-badge .age-label {
        padding: 0.2cqw 1.2cqw; background: rgba(0, 0, 0, 0.62);
        font-size: 2cqw; font-weight: 900; letter-spacing: 0.12em;
      }

      .loading-corner {
        position: absolute; top: calc(env(safe-area-inset-top, 0px) * .6 + 1.2%); right: 2.6%; z-index: 4;
        display: flex; flex-direction: column; align-items: center; gap: 2.8cqw;
      }
      .loading-corner button {
        display: grid; justify-items: center; gap: 2cqw;
        padding: 0; border: 0; background: none; color: #fff;
        font: inherit; cursor: pointer;
      }
      /* Age rating stands alone in the top-left corner at a fixed, unobtrusive size. */
      .age-corner {
        position: absolute; top: calc(env(safe-area-inset-top, 0px) * .6 + 1.2%); left: 3.2%; z-index: 4;
      }
      .age-corner > .age-badge { gap: 0.6cqw; }
      /* 2026-10-20: icons only — no plates, frames or captions; a soft shadow keeps them readable. */
      .loading-corner .side-icon {
        display: grid; place-items: center;
        width: 10cqw; height: 10cqw;
        filter: drop-shadow(0 0.3cqw 0.6cqw rgba(0, 0, 0, 0.75));
        transition: transform 120ms ease;
      }
      .loading-corner button:active .side-icon { transform: scale(0.88); }
      .loading-corner .side-icon svg { width: 7cqw; height: 7cqw; }
      .loading-corner .side-label {
        position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
      }
      .loading-corner button.has-dot { position: relative; }
      .loading-corner button.has-dot::after {
        content: ""; position: absolute; top: 1cqw; right: 1cqw;
        width: 2.2cqw; height: 2.2cqw; border-radius: 50%; background: #ff2e5c;
        box-shadow: 0 0 0 0.35cqw #fff;
      }

      /* Sound toggle for the CG's own music: off by default (phones block autoplaying sound). */
      #sound-button .sound-on { display: none; }
      #sound-button[aria-pressed="true"] .sound-on { display: inline; }
      #sound-button[aria-pressed="true"] .sound-off { display: none; }
      #sound-button[aria-pressed="false"] .side-icon { opacity: 0.82; }
      #sound-button .sound-off { stroke: #ff5f8f; }

      /* Slim loading strip along the bottom. */
      .loading-progress { position: absolute; left: 6%; right: 6%; bottom: 8.6%; z-index: 3; transition: opacity 300ms ease; }
      .ld-row { display: flex; align-items: baseline; justify-content: space-between; color: #fff; }
      .ld-row b { font-size: 3cqw; font-weight: 800; letter-spacing: 0.08em; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
      .ld-row span { font-size: 4.4cqw; font-style: italic; font-weight: 900; color: var(--cyan); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
      .track {
        position: relative;
        height: 1cqw;
        min-height: 4px;
        margin-top: 1.6cqw;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
      }
      #progress {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff6db5, var(--hot));
        box-shadow: 0 0 10px rgba(255, 46, 147, 0.85);
        transition: width 260ms ease-out;
      }
      #progress::after {
        content: "";
        position: absolute;
        right: -2cqw;
        top: 50%;
        width: 4cqw;
        aspect-ratio: 1;
        background: #fff;
        transform: translateY(-50%);
        clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }
      .loading-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .loading-note {
        min-height: 1.45em;
        margin-top: 1.8cqw;
        color: rgba(255, 255, 255, 0.78);
        font-size: 11px;
        font-size: 2.3cqw;
        line-height: 1.45;
        white-space: pre-line;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .loading-tip {
        margin-top: 1.4cqw;
        color: #fff;
        font-size: 12px;
        font-size: 2.7cqw;
        font-weight: 700;
        line-height: 1.5;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .loading-tip b {
        display: inline-block;
        margin-right: 1.6cqw;
        padding: 0.1cqw 1.4cqw;
        color: #fff;
        background: var(--hot);
        font-style: italic;
        font-weight: 900;
        text-shadow: none;
        transform: skewX(-14deg);
      }
      #loading-tip { transition: opacity 300ms ease; }

      /* Ready: the strip gives way to "tap to start". The tap also lets the browser
         start the lobby music, which phones block until the page is touched. */
      #loading.is-ready { cursor: pointer; }
      #loading.is-ready .loading-progress { opacity: 0; }
      .loading-start {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10%;
        z-index: 3;
        display: grid;
        gap: 1.6cqw;
        justify-items: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 300ms ease;
      }
      .loading-start strong {
        color: #fff;
        font-size: 4.6cqw;
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-shadow: 0.5cqw 0.5cqw 0 var(--hot), 0 0 12px rgba(0, 0, 0, 0.6);
      }
      .loading-start small {
        color: #fff;
        font-size: 2.8cqw;
        font-weight: 900;
        letter-spacing: 0.3em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #loading.is-ready .loading-start { opacity: 1; visibility: visible; animation: ld-pulse 1.6s ease-in-out infinite alternate; }
      #loading.is-hidden .loading-start { animation: ld-gone 0s 0.45s forwards; }
      @keyframes ld-pulse { from { opacity: 0.6; } to { opacity: 1; } }

      .loading-health {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1.2%;
        z-index: 3;
        color: rgba(255, 255, 255, 0.55);
        font-size: 9px;
        font-size: 1.9cqw;
        line-height: 1.6;
        text-align: center;
      }

      /* Live release number (release.json); scripts/verify-webgl.mjs keeps them equal. */
      .loading-version {
        position: absolute;
        right: 3%;
        bottom: 5%;
        z-index: 3;
        color: rgba(255, 255, 255, 0.6);
        font-size: 10px;
        font-size: 2.1cqw;
        font-style: italic;
        font-weight: 800;
      }

      #loading-dialog {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: none;
        place-items: center;
        background: rgba(6, 4, 22, 0.66);
        cursor: default;
      }
      #loading-dialog.is-open { display: grid; }
      .dialog-box {
        width: min(84%, 420px);
        padding: 18px 18px 14px;
        border: 3px solid #fff;
        color: #fff;
        background: #000;
        box-shadow: 8px 8px 0 var(--hot);
        transform: rotate(-1.5deg);
      }
      .dialog-box h3 { margin: 0 0 10px; font-size: 17px; font-style: italic; font-weight: 900; }
      .dialog-box p {
        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-line;
      }
      .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
      .dialog-actions button {
        padding: 8px 16px;
        border: 2px solid #fff;
        color: #fff;
        background: transparent;
        font: inherit;
        font-weight: 900;
        transform: skewX(-10deg);
      }
      .dialog-actions #dialog-ok { color: #fff; background: var(--hot); border-color: var(--hot); }

      /* The same paper / ink / violet material as the authored lobby entry stickers. */
      .dialog-box {
        position: relative;
        isolation: isolate;
        padding: 26px 24px 20px;
        border: 0;
        background: transparent;
        box-shadow: none;
        transform: none;
        filter: drop-shadow(7px 8px 0 #7028cc);
      }
      .dialog-box::before, .dialog-box::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: #f8f5ff;
        pointer-events: none;
        clip-path: polygon(3% 0, 28% 1%, 29% 0, 71% 1%, 73% 0, 97% 2%, 100% 8%, 99% 41%,
          100% 43%, 99% 91%, 95% 100%, 67% 99%, 65% 100%, 24% 99%, 22% 100%, 0 97%, 1% 62%, 0 60%, 1% 7%);
      }
      .dialog-box::after { inset: 3px; z-index: -1; background: #0d0916; }
      .dialog-box h3 { padding-bottom: 12px; border-bottom: 3px solid #893eff; font-size: 21px; font-style: normal; }
      .dialog-box p { font-size: 16px; line-height: 1.65; max-height: 45dvh; overflow-y: auto; touch-action: pan-y; }
      .dialog-actions { flex-wrap: wrap; }
      .dialog-actions button {
        min-height: 46px; min-width: 96px;
        padding: 9px 18px;
        border: 2px solid #f8f5ff;
        background: #0d0916;
        transform: none;
        clip-path: polygon(6% 0,100% 0,94% 100%,0 100%);
        transition: filter 120ms ease, translate 120ms ease;
      }
      /* 2026-10-20: no crystal plate — one clean slanted P5 block: hot pink, black offset. */
      .dialog-actions #dialog-ok {
        min-width: 140px; border-color: #ff2f8e; background: #ff2f8e;
        box-shadow: none; text-shadow: none; letter-spacing: .08em;
      }
      .dialog-actions { filter: drop-shadow(3px 3px 0 #000); }
      .dialog-actions button:hover, .dialog-actions button:focus-visible { filter: brightness(1.3); }
      .dialog-actions button:active { translate: 0 2px; filter: brightness(.85); }
      /* Plain words over the art (no plate): a thin pink slash underlines them. */
      .loading-start small {
        position: relative; display: inline-block; padding: 0 2cqw 1.6cqw;
        background: none; font-size: 3.5cqw; letter-spacing: .3em;
        text-shadow: 0 0.3cqw 0.8cqw rgba(0, 0, 0, 0.9);
      }
      .loading-start small::after {
        content: ""; position: absolute; left: 8%; right: 8%; bottom: 0; height: 0.7cqw;
        background: linear-gradient(90deg, transparent, #ff2f8e 18%, #ff2f8e 82%, transparent);
        transform: skewX(-30deg);
      }
      #retry { border-radius: 0; border: 2px solid #f8f5ff; background: #28133d; }

      @media (prefers-reduced-motion: reduce) {
        #loading *, #loading::after { animation: none !important; }
        #loading.is-ready .loading-start { opacity: 1; }
      }

      #warning {
        position: absolute;
        z-index: 5;
        top: 12px;
        left: 12px;
        right: 12px;
        display: none;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        color: #fff;
        background: rgba(38, 19, 66, 0.94);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        /* The game area blocks touch gestures and selection; messages stay scrollable and copyable. */
        touch-action: pan-y;
        -webkit-user-select: text;
        user-select: text;
      }

      #retry {
        display: none;
        width: 100%;
        margin-top: 9px;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 9px;
        color: #fff;
        background: linear-gradient(90deg, #704ee8, #c34caa);
        font: inherit;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        #game-shell {
          max-width: none;
          max-height: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" width="720" height="1536" tabindex="-1"></canvas>
      <div id="home-stage" aria-hidden="true">
        <div class="stage-beam stage-beam-a"></div>
        <div class="stage-beam stage-beam-b"></div>
        <canvas id="stage-atmosphere"></canvas>
        <canvas id="stage-sparks"></canvas>
      </div>
      <section id="character-moment" data-idle-clip="catalena-idle" data-clip-format="green" data-clip-version="r18a" data-idle-cuts="0-1.2,2.8-9" aria-label="首页角色演出" aria-hidden="true">
        <video id="moment-video" playsinline webkit-playsinline preload="none"></video>
      </section>
      <div id="warning" role="status">
        <span id="warning-text"></span>
        <button id="retry" type="button">重新加载</button>
      </div>
      <div id="loading">
        <video id="loading-cg" class="ld-cg" data-has-bgm="true" src="./media/loading-cg.mp4?v=r20e" poster="./media/loading-cg.webp"
          muted autoplay loop playsinline webkit-playsinline preload="auto" aria-hidden="true"></video>
        <div class="ld-shade-top"></div>

              new Set(files).size !== 4 || !files.every(file => typeof file === "string" && safe.test(file)) ||
              !suffixes.every(suffix => files.filter(file => file.endsWith(suffix)).length === 1)) {
            throw new Error("Invalid version metadata");
          }
          const asset = suffix => buildAssetUrl(files.find(file => file.endsWith(suffix)));
          config.dataUrl = asset(".data.unityweb");
          config.frameworkUrl = asset(".framework.js.unityweb");
          config.codeUrl = asset(".wasm.unityweb");
          loader.src = asset(".loader.js");
          // Cached files of any other Unity build can go.
          const previous = Array.isArray(version.previous) ? version.previous.filter(file => safe.test(file)) : [];
          workers?.controller?.postMessage({ type: "keep-builds", files: [...files, ...previous] });
        } catch (_) {
          // Offline, slow, or older host: the embedded complete bundle remains valid.
          // Publication retains the preceding bundle at these immutable URLs.
        } finally { window.clearTimeout(timeout); }
        await showDownloadNote();
        await assetWorkerControl;
        try {
          config.dataUrl = await resumableData(config.dataUrl);
        } catch (error) {
          showBanner("游戏资源下载中断，请确认网络后点重新加载。", "error");
          return;
        }
        if (retryToken) await assetCacheCleanup;
        document.body.appendChild(loader);
      }
      // The ~100 MB data file used to be one request that restarted from zero whenever iOS
      // suspended the page. It now arrives in 4 MB byte ranges kept in Cache Storage:
      // leaving the page and coming back resumes from the last finished piece, and the
      // assembled file is stored whole for the next launch. Anything unsupported (no
      // Cache Storage, a server without ranges) falls back to the plain single request.
      const partCacheName = "cho-siren-parts-1";
      const partSize = 4 * 1024 * 1024;
      function whenVisible() {
        if (!document.hidden || typeof document.addEventListener !== "function") return Promise.resolve();
        return new Promise(resolve => {
          const shown = () => {
            if (document.hidden) return;
            document.removeEventListener("visibilitychange", shown);
            resolve();
          };
          document.addEventListener("visibilitychange", shown);
        });
      }
      const pause = ms => new Promise(resolve => window.setTimeout(resolve, ms));
      async function resumableData(url) {
        if (retryToken || !("caches" in window) || typeof Blob !== "function" || typeof fetch !== "function" ||
            typeof URL.createObjectURL !== "function" || !/\.data\.unityweb$/.test(new URL(url).pathname)) return url;
        let assets, parts;
        try {
          assets = await caches.open(assetCacheName);
          const whole = await assets.match(url);
          if (whole) return URL.createObjectURL(await whole.blob());
          parts = await caches.open(partCacheName);
        } catch (_) { return url; }
        // Learn the size from the first piece (or from a previous visit's record).
        const metaKey = `${url}?parts=meta`;
        let total = 0;
        const meta = await parts.match(metaKey);
        if (meta) total = Number((await meta.json()).total) || 0;
        const fetchPart = async (start, end) => {
          const response = await fetch(url, { headers: { Range: `bytes=${start}-${end}` },
            cache: "no-store", credentials: "same-origin" });
          if (response.status !== 206) return null;
          return response;
        };
        if (!(total > 0)) {
          const first = await fetchPart(0, partSize - 1).catch(() => null);
          const range = first && first.headers.get("content-range");
          total = range ? Number(range.split("/")[1]) : 0;
          if (!(total > 0)) return url;
          const blob = await first.blob();
          if (blob.size !== Math.min(partSize, total)) return url;
          await parts.put(`${url}?part=0`, new Response(blob));
          await parts.put(metaKey, new Response(JSON.stringify({ total })));
        }
        const count = Math.ceil(total / partSize);
        let received = 0;
        const have = new Array(count).fill(false);
        for (let i = 0; i < count; i++) {
          if (await parts.match(`${url}?part=${i}`)) {
            have[i] = true;
            received += Math.min(partSize, total - i * partSize);
          }
        }
        // Live download speed averaged over the last ~8 s (the player's own connection). Three pieces
        // download at once and often finish together, so the average keeps a long enough window and the
        // last figure stays on screen between updates (2026-10-25: it used to blank after each burst).
        const speedSamples = [];
        let lastSpeed = "";
        const speedText = () => {
          const now = performance.now();
          speedSamples.push([now, received]);
          while (speedSamples.length > 1 && now - speedSamples[0][0] > 8000) speedSamples.shift();
          const [t0, b0] = speedSamples[0];
          if (now - t0 >= 1000) {
            const bps = (received - b0) * 1000 / (now - t0);
            lastSpeed = bps >= 1048576 ? ` · ${(bps / 1048576).toFixed(1)}MB/s` : ` · ${Math.max(0, Math.round(bps / 1024))}KB/s`;
          }
          return lastSpeed;
        };
        const report = () => {
          const mb = n => (n / 1048576).toFixed(0);
          showProgress(0.6 * received / total);
          loadingNote.textContent = `正在下载游戏资源 ${mb(received)}/${mb(total)}MB${speedText()}\n可以切出去，回来会接着下载`;
        };
        report();
        const getPart = async i => {
          const start = i * partSize, end = Math.min(total, start + partSize) - 1;
          for (let attempt = 0; ; attempt++) {
            // 2026-10-20: keep downloading while the page is in the background (desktop/Android
            // continue; iOS freezes hidden pages itself and resumes here when the page returns).
            try {
              const response = await fetchPart(start, end);
              if (!response) throw new Error("range unsupported");
              const blob = await response.blob();
              if (blob.size !== end - start + 1) throw new Error("short piece");
              await parts.put(`${url}?part=${i}`, new Response(blob));
              received += blob.size;
              report();
              return;
            } catch (error) {
              // Hidden pages and brief signal drops just wait; only repeated failures
              // while the player is looking at the page become an error.
              if (attempt >= 6 && !document.hidden) throw error;
              await pause(Math.min(8000, 1000 * 2 ** Math.min(attempt, 3)));
            }
          }
        };
        const queue = [];
        for (let i = 0; i < count; i++) if (!have[i]) queue.push(i);
        // refresh once a second so the speed shows between finished pieces too
        const ticker = typeof setInterval === "function" ? setInterval(report, 1000) : null;
        try {
          await Promise.all([0, 1, 2].map(async () => {
            while (queue.length) await getPart(queue.shift());
          }));
        } finally {
          if (ticker !== null) clearInterval(ticker);
        }
        const blobs = [];
        for (let i = 0; i < count; i++) blobs.push(await (await parts.match(`${url}?part=${i}`)).blob());
        const full = new Blob(blobs, { type: "application/octet-stream" });
        if (full.size !== total) throw new Error("incomplete data");
        try {
          await assets.put(url, new Response(full, { headers: { "Content-Type": "application/vnd.unity" } }));
          await caches.delete(partCacheName);
        } catch (_) {}
        loadingNote.textContent = "下载完成，正在启动游戏…";
        return URL.createObjectURL(full);
      }
      async function showDownloadNote() {
        let cached = false;
        try {
          if (!retryToken && "caches" in window) {
            cached = Boolean(await caches.match(config.dataUrl, { cacheName: assetCacheName }));
          }
        } catch (_) {}
        loadingNote.textContent = cached ? "正在从本机缓存载入…"
          : "首次进入需下载约 110MB 资源，建议连接 Wi-Fi" + (workers ? "\n下次打开直接读取本机缓存" : "");
      }
      // Neon-shard mouse trail. Optional decoration: skipped wherever the page has no real
      // canvas 2D support (old browsers, the test harness's minimal DOM).
      const trailHost = document.querySelector("#game-shell");
      const trailCanvas = typeof document.createElement === "function" ? document.createElement("canvas") : null;
      const trailCtx = trailHost && typeof trailHost.appendChild === "function" &&
        trailCanvas && typeof trailCanvas.getContext === "function" ? trailCanvas.getContext("2d") : null;
      if (trailCtx) { trailCanvas.id = "siren-trail"; trailHost.appendChild(trailCanvas); }
      const trailColors = ["#ff2e93", "#3ff0ff", "#ffffff", "#ff2e93", "#b58cff"];
      let trailShards = [], trailLast = null, trailDist = 0, trailRunning = false;
      function trailStar(c, s) {
        c.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 ? s * .3 : s, a = i * Math.PI / 4 - Math.PI / 2;
          c[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
        }
        c.closePath();
      }
      function trailFrame() {
        const w = trailHost.clientWidth, h = trailHost.clientHeight, d = Math.min(2, devicePixelRatio || 1);
        if (trailCanvas.width !== Math.round(w * d) || trailCanvas.height !== Math.round(h * d)) {
          trailCanvas.width = Math.round(w * d); trailCanvas.height = Math.round(h * d);
        }
        trailCtx.setTransform(d, 0, 0, d, 0, 0);
        trailCtx.clearRect(0, 0, w, h);
        trailShards = trailShards.filter(it => it.life > 0);
        for (const it of trailShards) {
          const c = trailCtx;
          c.save(); c.translate(it.x, it.y); c.rotate(it.rot); c.globalAlpha = Math.min(1, it.life * 1.4);
          c.shadowColor = it.col; c.shadowBlur = it.star ? 8 : 6; c.fillStyle = it.col;
          if (it.star) { trailStar(c, it.s); c.fill(); }
          else {
            c.beginPath(); c.moveTo(-it.s * .9, -it.s * .45); c.lineTo(it.s * 1.25, -it.s * .05); c.lineTo(-it.s * .35, it.s * .6); c.closePath();
            c.fill(); c.shadowBlur = 0; c.strokeStyle = "#1a0b33"; c.lineWidth = 1.6; c.stroke();
          }
          c.restore();
          it.x += it.vx; it.y += it.vy; it.vx *= .93; it.vy *= .93; it.rot += it.vr; it.life -= .028;
        }
        if (trailShards.length) requestAnimationFrame(trailFrame); else { trailRunning = false; trailCtx.clearRect(0, 0, w, h); }
      }
      if (trailCtx) canvas.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse" || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const box = trailHost.getBoundingClientRect();
        const x = event.clientX - box.left, y = event.clientY - box.top;
        const dx = trailLast ? x - trailLast.x : 0, dy = trailLast ? y - trailLast.y : 0;
        trailDist += Math.hypot(dx, dy); trailLast = { x, y };
        if (trailDist < 11) return;
        trailDist = 0;
        const len = Math.hypot(dx, dy) || 1;
        for (let k = 0; k < 2; k++) {
          const side = k ? 1 : -1, star = Math.random() < .18;
          trailShards.push({ x, y, life: 1, star, rot: Math.random() * 6.3, vr: (Math.random() - .5) * .28,
            vx: (-dy / len) * side * (1 + Math.random() * 1.5) - dx * .04,
            vy: (dx / len) * side * (1 + Math.random() * 1.5) - dy * .04 - .2,
            s: star ? 4 + Math.random() * 3 : 5 + Math.random() * 6,
            col: star ? "#ffe9a8" : trailColors[Math.floor(Math.random() * trailColors.length)] });
        }
        if (trailShards.length > 160) trailShards.splice(0, trailShards.length - 160);
        if (!trailRunning) { trailRunning = true; requestAnimationFrame(trailFrame); }
      }, { passive: true });
      if (trailCtx) canvas.addEventListener("pointerleave", () => { trailLast = null; });
      canvas.addEventListener("dblclick", () => {
        if (window.choSirenStage?.active) {
          window.choSirenUnityInstance?.SendMessage("PsdHome20260921", "ToggleUiFromBrowser");
        }
      });
      // A home-screen app can stay open for days. Whenever the page comes back to the
      // foreground, check whether a newer release is live and offer to load it.
      let updateOffered = false;
      async function checkForUpdate() {
        if (updateOffered || document.hidden) return;
        try {
          const response = await fetch(new URL(`release.json?_=${Date.now()}`, pageUrl), { cache: "no-store" });
          const live = response.ok ? await response.json() : null;
          if (!live || typeof live.version !== "string" || live.version === config.productVersion) return;
          updateOffered = true;
          reloadInPlace = true;
          showBanner(`新版本 v${live.version} 已上线，点下面的按钮更新（点这段文字可先关闭）。`, "update");
        } catch (_) {}
      }
      document.addEventListener("visibilitychange", checkForUpdate);
      startGame();
    </script>
  </body>
